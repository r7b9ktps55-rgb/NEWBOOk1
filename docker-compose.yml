services:
  bookhub:
    build: .
    container_name: bookhub
    restart: unless-stopped
    env_file: .env
    environment:
      # Доверять X-Forwarded-For только от Caddy (его адрес закреплён ниже). Пусто или «*» здесь
      # опасно: за прокси все посетители выглядели бы одним адресом, и чужие неверные пароли
      # блокировали бы вход владельцу; «*» позволил бы подделывать адрес в обход Caddy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.57.10}
    networks:
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Разбор огромной книги не должен съесть всю память сервера
    mem_limit: ${MEM_LIMIT:-2g}
    ports:
      # По умолчанию сайт доступен только с этого компьютера.
      # Чтобы открыть его в локальной сети, поставьте BIND=0.0.0.0 в .env.
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    # Даём закончить запись заметки перед остановкой
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS для доступа из интернета (нужен домен, указывающий на сервер, и открытые порты 80/443):
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks:
      web:
        ipv4_address: 172.30.57.10
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bookhub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  caddy-data:
  caddy-config:
