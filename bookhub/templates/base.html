{% from "_icons.html" import icon %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  {% block head_extra %}{% endblock %}
  <title>{% block title %}Book Hub{% endblock %}</title>
  <link rel="preload" href="/static/fonts/mulish-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/source-serif-4-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
  <link rel="icon" href="/static/favicon.svg?v={{ asset_v }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v={{ asset_v }}">
  <link rel="manifest" href="/static/manifest.webmanifest?v={{ asset_v }}">
  <meta name="apple-mobile-web-app-title" content="Book Hub">
  <script type="module" src="/static/app.js?v={{ asset_v }}"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="nav-wrap">
    <nav class="nav" aria-label="Основная навигация">
      <a href="/" class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="bg" cx="16" cy="16" r="16"/><path class="pg" d="M10 9.5h8.5a3.5 3.5 0 0 1 3.5 3.5v9.5h-8.5A3.5 3.5 0 0 1 10 19Z"/><path class="ln" d="M13.5 14h5M13.5 17.5h3.5"/></svg>
        Book Hub
      </a>
      {% block nav %}{% endblock %}
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Текст книг отправляется в Google Gemini для обработки, заметки хранятся на этом сервере.</footer>
  <div class="toasts" aria-live="polite" data-toasts></div>
</body>
</html>
